<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Think secure. Build smart.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#0B1A12"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#22C55E" fill-opacity="0.045"/>
    </pattern>
    <clipPath id="t1"><rect x="40" y="20" height="30" width="0">
      <animate attributeName="width" values="0;0;70;70;0" keyTimes="0;0.05;0.15;0.95;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="1000" height="130" fill="url(#bg)"/>
  <rect width="1000" height="130" fill="url(#scan)"/>
  <rect x="0" y="0" width="1000" height="1.5" fill="#1F3A2B"/>
  <g font-family="'SFMono-Regular', Consolas, 'Courier New', monospace">
    <g clip-path="url(#t1)" font-size="16">
      <text x="40" y="42"><tspan fill="#22C55E">$ </tspan><tspan fill="#D1FAE5">exit</tspan></text>
    </g>
    <text x="40" y="72" font-size="14" fill="#4B7F63" opacity="0">
      [ connection closed ]  session secured
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.24;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="106" text-anchor="middle" font-size="17" fill="#BBF7D0" letter-spacing="5" opacity="0">
      THINK SECURE. BUILD SMART.<tspan fill="#22C55E">_
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.36;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
