<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Security workflow: reconnaissance, enumeration, analysis, detection, defense, improvement">
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" text-anchor="middle">
    <!-- rail -->
    <path id="rail" d="M100,62 H900" stroke="#1F3A2B" stroke-width="2" fill="none"/>
    <path d="M100,62 H900" stroke="#22C55E" stroke-width="2" fill="none" stroke-dasharray="3 9" stroke-opacity="0.55">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- nodes -->
    <g>
      <circle cx="100" cy="62" r="26" fill="#08110C" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="100" cy="62" r="26" fill="none" stroke="#4ADE80" stroke-width="2"><animate attributeName="r" values="26;42;42" keyTimes="0;0.2;1" dur="9s" begin="0s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
      <text x="100" y="68" font-size="16" font-weight="700" fill="#4ADE80">01</text>
      <text x="100" y="124" font-size="12" fill="#A7F3D0" letter-spacing="2">RECON</text>
    </g>
    <g>
      <circle cx="260" cy="62" r="26" fill="#08110C" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="260" cy="62" r="26" fill="none" stroke="#4ADE80" stroke-width="2"><animate attributeName="r" values="26;42;42" keyTimes="0;0.2;1" dur="9s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="9s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text x="260" y="68" font-size="16" font-weight="700" fill="#4ADE80">02</text>
      <text x="260" y="124" font-size="12" fill="#A7F3D0" letter-spacing="2">ENUMERATE</text>
    </g>
    <g>
      <circle cx="420" cy="62" r="26" fill="#08110C" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="420" cy="62" r="26" fill="none" stroke="#4ADE80" stroke-width="2"><animate attributeName="r" values="26;42;42" keyTimes="0;0.2;1" dur="9s" begin="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="9s" begin="3s" repeatCount="indefinite"/></circle>
      <text x="420" y="68" font-size="16" font-weight="700" fill="#4ADE80">03</text>
      <text x="420" y="124" font-size="12" fill="#A7F3D0" letter-spacing="2">ANALYSE</text>
    </g>
    <g>
      <circle cx="580" cy="62" r="26" fill="#08110C" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="580" cy="62" r="26" fill="none" stroke="#4ADE80" stroke-width="2"><animate attributeName="r" values="26;42;42" keyTimes="0;0.2;1" dur="9s" begin="4.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="9s" begin="4.5s" repeatCount="indefinite"/></circle>
      <text x="580" y="68" font-size="16" font-weight="700" fill="#4ADE80">04</text>
      <text x="580" y="124" font-size="12" fill="#A7F3D0" letter-spacing="2">DETECT</text>
    </g>
    <g>
      <circle cx="740" cy="62" r="26" fill="#08110C" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="740" cy="62" r="26" fill="none" stroke="#4ADE80" stroke-width="2"><animate attributeName="r" values="26;42;42" keyTimes="0;0.2;1" dur="9s" begin="6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="9s" begin="6s" repeatCount="indefinite"/></circle>
      <text x="740" y="68" font-size="16" font-weight="700" fill="#4ADE80">05</text>
      <text x="740" y="124" font-size="12" fill="#A7F3D0" letter-spacing="2">DEFEND</text>
    </g>
    <g>
      <circle cx="900" cy="62" r="26" fill="#08110C" stroke="#22C55E" stroke-width="1.5"/>
      <circle cx="900" cy="62" r="26" fill="none" stroke="#4ADE80" stroke-width="2"><animate attributeName="r" values="26;42;42" keyTimes="0;0.2;1" dur="9s" begin="7.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.9;0;0" keyTimes="0;0.2;1" dur="9s" begin="7.5s" repeatCount="indefinite"/></circle>
      <text x="900" y="68" font-size="16" font-weight="700" fill="#4ADE80">06</text>
      <text x="900" y="124" font-size="12" fill="#A7F3D0" letter-spacing="2">IMPROVE</text>
    </g>

    <text x="500" y="156" font-size="11" fill="#4B7F63" letter-spacing="4">UNDERSTAND  →  IDENTIFY  →  ANALYSE  →  DETECT  →  SECURE</text>
  </g>

  <!-- probe -->
  <circle r="5" fill="#ECFDF5" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.84;1" calcMode="linear">
      <mpath xlink:href="#rail"/>
    </animateMotion>
  </circle>
</svg>
