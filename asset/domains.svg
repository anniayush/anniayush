<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Security domains: offensive security, defensive security, cryptography, hardware security">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A15"/>
      <stop offset="1" stop-color="#080D0B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#166534" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g font-family="'SFMono-Regular', Consolas, 'Courier New', monospace">

    <!-- 01 OFFENSIVE -->
    <g transform="translate(20,10)">
      <rect width="470" height="200" rx="14" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="4.5" fill="#22C55E"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="46" y="39" font-size="13" font-weight="700" fill="#22C55E" letter-spacing="3">01 // OFFENSIVE SECURITY</text>
      <rect x="24" y="54" width="422" height="1" fill="#1F3A2B"/>
      <g font-size="13.5" fill="#C7F5D9">
        <text x="28" y="82"><tspan fill="#22C55E">›</tspan>  Ethical Hacking Fundamentals</text>
        <text x="28" y="108"><tspan fill="#22C55E">›</tspan>  Penetration Testing Concepts</text>
        <text x="28" y="134"><tspan fill="#22C55E">›</tspan>  Web Application Security</text>
        <text x="28" y="160"><tspan fill="#22C55E">›</tspan>  OWASP Top 10</text>
        <text x="258" y="134"><tspan fill="#22C55E">›</tspan>  Vulnerability Assessment</text>
        <text x="258" y="160"><tspan fill="#22C55E">›</tspan>  Security Testing</text>
      </g>
    </g>

    <!-- 02 DEFENSIVE -->
    <g transform="translate(510,10)">
      <rect width="470" height="200" rx="14" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="4.5" fill="#22C55E"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text x="46" y="39" font-size="13" font-weight="700" fill="#22C55E" letter-spacing="3">02 // DEFENSIVE SECURITY</text>
      <rect x="24" y="54" width="422" height="1" fill="#1F3A2B"/>
      <g font-size="13.5" fill="#C7F5D9">
        <text x="28" y="82"><tspan fill="#22C55E">›</tspan>  Network Security Fundamentals</text>
        <text x="28" y="108"><tspan fill="#22C55E">›</tspan>  Security Monitoring</text>
        <text x="28" y="134"><tspan fill="#22C55E">›</tspan>  Log Analysis</text>
        <text x="28" y="160"><tspan fill="#22C55E">›</tspan>  Threat Detection</text>
        <text x="258" y="134"><tspan fill="#22C55E">›</tspan>  Incident Response</text>
        <text x="258" y="160"><tspan fill="#22C55E">›</tspan>  System Hardening</text>
      </g>
    </g>

    <!-- 03 CRYPTOGRAPHY -->
    <g transform="translate(20,230)">
      <rect width="470" height="200" rx="14" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="4.5" fill="#22C55E"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="46" y="39" font-size="13" font-weight="700" fill="#22C55E" letter-spacing="3">03 // CRYPTOGRAPHY</text>
      <rect x="24" y="54" width="422" height="1" fill="#1F3A2B"/>
      <g font-size="13.5" fill="#C7F5D9">
        <text x="28" y="82"><tspan fill="#22C55E">›</tspan>  AES Encryption</text>
        <text x="28" y="108"><tspan fill="#22C55E">›</tspan>  Symmetric Cryptography</text>
        <text x="28" y="134"><tspan fill="#22C55E">›</tspan>  Asymmetric Cryptography</text>
        <text x="28" y="160"><tspan fill="#22C55E">›</tspan>  Hashing Fundamentals</text>
        <text x="258" y="160"><tspan fill="#22C55E">›</tspan>  Secure Data Transmission</text>
      </g>
    </g>

    <!-- 04 HARDWARE -->
    <g transform="translate(510,230)">
      <rect width="470" height="200" rx="14" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="30" cy="34" r="4.5" fill="#22C55E"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
      <text x="46" y="39" font-size="13" font-weight="700" fill="#22C55E" letter-spacing="3">04 // HARDWARE SECURITY</text>
      <rect x="24" y="54" width="422" height="1" fill="#1F3A2B"/>
      <g font-size="13.5" fill="#C7F5D9">
        <text x="28" y="82"><tspan fill="#22C55E">›</tspan>  FPGA Security</text>
        <text x="28" y="108"><tspan fill="#22C55E">›</tspan>  Hardware Trojan Detection</text>
        <text x="28" y="134"><tspan fill="#22C55E">›</tspan>  Power Side-Channel Analysis</text>
        <text x="28" y="160"><tspan fill="#22C55E">›</tspan>  AES-128 Implementation</text>
        <text x="258" y="160"><tspan fill="#22C55E">›</tspan>  ML-Based Detection</text>
      </g>
    </g>
  </g>
</svg>
